name: Test host isolation with workspace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal workspace for host isolation test
        id: workspace
        run: |
          # Create a minimal git repo with a single commit so the verifier
          # has a valid workspace with head=base (empty diff, no checks to run).
          WDIR="$RUNNER_TEMP/minimal-host-workspace"
          mkdir -p "$WDIR"
          cd "$WDIR"
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "# Minimal host isolation test repo" > README.md
          git add README.md
          git commit -q -m "Initial commit"
          HEAD=$(git rev-parse HEAD)
          echo "workspace=$WDIR" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "base=$HEAD" >> "$GITHUB_OUTPUT"
          echo "Created minimal workspace at $WDIR with HEAD=$HEAD"

      - id: action
        uses: .
        continue-on-error: true
        with:
          workspace: ${{ steps.workspace.outputs.workspace }}
          head: ${{ steps.workspace.outputs.head }}
          base: ${{ steps.workspace.outputs.base }}
          isolation: host
          comment: "false"
          attest: "false"
          allow-self-hosted: "true"

      - name: Assert report output when action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REPORT: ${{ steps.action.outputs.report }}
          EVIDENCE: ${{ steps.action.outputs.evidence }}
          ARTIFACT: ${{ steps.action.outputs.artifact }}
          BASE_OUT: ${{ steps.action.outputs.base }}
          BASE_IN: ${{ steps.workspace.outputs.base }}
        run: |
          echo "outcome:  $OUTCOME"
          echo "report:   $REPORT"
          echo "evidence: $EVIDENCE"
          echo "artifact: $ARTIFACT"
          echo "base out: $BASE_OUT"
          echo "base in:  $BASE_IN"

          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — verify outputs are set
            if [ -z "$REPORT" ]; then
              echo "FAIL: report output is empty"
              exit 1
            fi
            echo "PASS: report output is set: $REPORT"

            if [ -z "$EVIDENCE" ]; then
              echo "FAIL: evidence output is empty"
              exit 1
            fi
            if [ ! -d "$EVIDENCE" ]; then
              echo "FAIL: evidence directory does not exist at $EVIDENCE"
              exit 1
            fi
            echo "PASS: evidence directory exists: $EVIDENCE"

            if [ -z "$ARTIFACT" ]; then
              echo "FAIL: artifact output is empty"
              exit 1
            fi
            if ! echo "$ARTIFACT" | grep -qE '^swarm-verify-'; then
              echo "FAIL: artifact name does not start with 'swarm-verify-': $ARTIFACT"
              exit 1
            fi
            echo "PASS: artifact name is valid: $ARTIFACT"

            if [ -z "$BASE_OUT" ]; then
              echo "FAIL: base output is empty"
              exit 1
            fi
            echo "PASS: base output is set: $BASE_OUT"

          elif [ "$OUTCOME" = "failure" ]; then
            # Action failed — acceptable if it failed gracefully
            echo "INFO: action failed (outcome=failure)"
            if [ -n "$ARTIFACT" ]; then
              echo "INFO: artifact was set to '$ARTIFACT' before failure"
            fi
            echo "PASS: action failed gracefully (build or verification issue in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
