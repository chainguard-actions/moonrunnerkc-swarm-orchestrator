name: Test swarm-verify outputs are populated on refusal
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Even when the action refuses (no PR, no head/base), it must still write a verdict
      # document and populate the verdict, verdict-digest, evidence, and artifact outputs.
      - id: action
        uses: .
        continue-on-error: true
        with:
          isolation: host
          comment: "false"
          attest: "false"
          allow-self-hosted: "true"
      - name: Assert verdict and evidence outputs are populated
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          VERDICT_DIGEST: ${{ steps.action.outputs.verdict-digest }}
          EVIDENCE: ${{ steps.action.outputs.evidence }}
          ARTIFACT: ${{ steps.action.outputs.artifact }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome:        $OUTCOME"
          echo "result:         $RESULT"
          echo "status:         $STATUS"
          echo "verdict:        $VERDICT"
          echo "verdict-digest: $VERDICT_DIGEST"
          echo "evidence:       $EVIDENCE"
          echo "artifact:       $ARTIFACT"

          # Action must have failed (exit 4)
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (exit 4 for refused), got outcome=$OUTCOME"
            exit 1
          fi

          # result must be refused
          if [ "$RESULT" != "refused" ]; then
            echo "FAIL: expected result=refused, got '$RESULT'"
            exit 1
          fi

          # verdict path must be set and the file must exist
          if [ -z "$VERDICT" ]; then
            echo "FAIL: verdict output is empty"
            exit 1
          fi
          if [ ! -f "$VERDICT" ]; then
            echo "FAIL: verdict file does not exist at '$VERDICT'"
            exit 1
          fi

          # verdict-digest must be a sha256: prefixed hex string
          if [ -z "$VERDICT_DIGEST" ]; then
            echo "FAIL: verdict-digest output is empty"
            exit 1
          fi
          if ! echo "$VERDICT_DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "FAIL: verdict-digest does not look like sha256:<hex64>, got '$VERDICT_DIGEST'"
            exit 1
          fi

          # evidence directory must be set and exist
          if [ -z "$EVIDENCE" ]; then
            echo "FAIL: evidence output is empty"
            exit 1
          fi
          if [ ! -d "$EVIDENCE" ]; then
            echo "FAIL: evidence directory does not exist at '$EVIDENCE'"
            exit 1
          fi

          # artifact name must be set (UUID-based)
          if [ -z "$ARTIFACT" ]; then
            echo "FAIL: artifact output is empty"
            exit 1
          fi
          if ! echo "$ARTIFACT" | grep -qE '^swarm-verify-[0-9a-f-]{36}$'; then
            echo "FAIL: artifact name does not match expected pattern, got '$ARTIFACT'"
            exit 1
          fi

          echo "PASS: all verdict and evidence outputs are correctly populated"
