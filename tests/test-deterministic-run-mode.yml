name: Test deterministic run mode with goal
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action with deterministic providers and goal
        id: action
        uses: .
        with:
          goal: 'write a hello world function'
          extractor: 'deterministic'
          session: 'deterministic'
          falsifiers: 'off'
          result-path: '/tmp/swarm-result-test.json'
        continue-on-error: true

      - name: Assert action attempted run with deterministic providers
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          # The action should have passed shell validation and attempted CLI invocation
          # result output may be set if the CLI ran successfully
          if [ -n "$RESULT" ]; then
            echo "PASS: result output was set: $RESULT"
          else
            echo "INFO: result output not set (CLI may not be available in test env)"
            echo "PASS: shell validation passed for deterministic run mode"
          fi
