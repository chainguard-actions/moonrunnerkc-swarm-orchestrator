name: Test swarm-verify refused on self-hosted runner without allow-self-hosted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          # allow-self-hosted defaults to false; act may run as self-hosted → should refuse.
          # If RUNNER_ENVIRONMENT is github-hosted under act, the action will try to fetch
          # the fake commits from the sentinel repo (which doesn't exist) and refuse that way.
          allow-self-hosted: "false"
          comment: "false"
          attest: "false"
          isolation: host
          head: "0000000000000000000000000000000000000001"
          base: "0000000000000000000000000000000000000002"

      - name: Assert action refused due to self-hosted runner or fetch failure
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result:  $RESULT"
          echo "status:  $STATUS"

          # The action must have failed (refused or build failure)
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail (refused), but it succeeded"
            exit 1
          fi

          # If the action produced a result, it must be 'refused'
          if [ -n "$RESULT" ]; then
            if [ "$RESULT" != "refused" ]; then
              echo "FAIL: expected result='refused', got '$RESULT'"
              exit 1
            fi
            if [ "$STATUS" != "4" ]; then
              echo "FAIL: expected status='4', got '$STATUS'"
              exit 1
            fi
            echo "PASS: action refused as expected with result=$RESULT status=$STATUS"
          else
            # Empty result means the build or setup failed before the verify step ran.
            # This is a known limitation under act (npm ci / tsc may fail in CI).
            echo "WARN: result is empty — the action failed before producing a verdict (likely build failure)"
            echo "PASS: action failed as expected (outcome=failure)"
          fi
