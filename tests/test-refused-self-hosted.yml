name: Test swarm-verify refused on self-hosted runner without allow-self-hosted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          isolation: host
          comment: "false"
          attest: "false"
          allow-self-hosted: "false"
          # Under act, RUNNER_ENVIRONMENT is not 'github-hosted', so the action
          # must refuse because allow-self-hosted is false.
          # No head/base supplied either, so even if RUNNER_ENVIRONMENT were
          # github-hosted, the action would still refuse (no PR, no head/base).

      - name: Assert action refused due to self-hosted runner (or no head/base)
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result:  $RESULT"
          echo "status:  $STATUS"
          # The action must fail (exit non-zero for refused/incomplete)
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (refused), got outcome=$OUTCOME"
            exit 1
          fi
          # If the result output is available, it must be 'refused'
          # (composite action outputs may not be set when the action fails under act)
          if [ -n "$RESULT" ] && [ "$RESULT" != "refused" ]; then
            echo "FAIL: expected result=refused, got '$RESULT'"
            exit 1
          fi
          echo "PASS: action failed as expected (result=${RESULT:-not-available})"
