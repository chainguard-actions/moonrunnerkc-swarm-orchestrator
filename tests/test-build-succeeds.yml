name: Test build step – verifier builds from source
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with allow-self-hosted and valid-looking inputs.
      # The primary assertion is that the build step (npm ci + npm run build:verify)
      # completes and the verifier entry point is produced. The verify step itself
      # will fail gracefully (refused) due to the sentinel GITHUB_REPOSITORY or
      # because the fetch of the placeholder SHAs fails.
      - id: action
        uses: .
        continue-on-error: true
        with:
          head: "0000000000000000000000000000000000000001"
          base: "0000000000000000000000000000000000000002"
          comment: "false"
          attest: "false"
          allow-self-hosted: "true"
          isolation: host

      - name: Assert action outcome is failure or success (not skipped/cancelled)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result:  $RESULT"
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran to completion (outcome=$OUTCOME)"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled (possible timeout during npm install or build)"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — action may not have run"
            exit 1
          fi
