name: Test swarm-verify with prepared workspace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve real head and base commits
        id: commits
        run: |
          HEAD=$(git rev-parse HEAD)
          BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head: $HEAD"
          echo "base: $BASE"

      - id: action
        uses: .
        continue-on-error: true
        with:
          allow-self-hosted: "true"
          comment: "false"
          attest: "false"
          isolation: host
          workspace: ${{ github.workspace }}
          head: ${{ steps.commits.outputs.head }}
          base: ${{ steps.commits.outputs.base }}

      - name: Assert action produced outputs
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          HEAD_OUT: ${{ steps.action.outputs.head }}
          BASE_OUT: ${{ steps.action.outputs.base }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          OUTCOME: ${{ steps.action.outcome }}
          EXPECTED_HEAD: ${{ steps.commits.outputs.head }}
          EXPECTED_BASE: ${{ steps.commits.outputs.base }}
        run: |
          echo "outcome:  $OUTCOME"
          echo "result:   $RESULT"
          echo "status:   $STATUS"
          echo "head:     $HEAD_OUT"
          echo "base:     $BASE_OUT"
          echo "verdict:  $VERDICT"

          # If result is empty, the build or setup failed before the verify step ran.
          if [ -z "$RESULT" ]; then
            if [ "$OUTCOME" = "success" ]; then
              echo "FAIL: action succeeded but result output is empty"
              exit 1
            fi
            echo "WARN: result is empty — the action failed before producing a verdict (likely build failure)"
            echo "PASS: action failed (outcome=failure); build may have failed under act"
            exit 0
          fi

          # Result must be one of the known values
          case "$RESULT" in
            verified|not-verified|incomplete|refused|regression-only|head-changed)
              echo "PASS: result is a known value: $RESULT"
              ;;
            *)
              echo "FAIL: unexpected result value: $RESULT"
              exit 1
              ;;
          esac

          # Head output must match what we provided
          if [ "$HEAD_OUT" != "$EXPECTED_HEAD" ]; then
            echo "FAIL: head output '$HEAD_OUT' does not match expected '$EXPECTED_HEAD'"
            exit 1
          fi

          # Base output must match what we provided
          if [ "$BASE_OUT" != "$EXPECTED_BASE" ]; then
            echo "FAIL: base output '$BASE_OUT' does not match expected '$EXPECTED_BASE'"
            exit 1
          fi

          # Verdict file must exist if the path is set
          if [ -n "$VERDICT" ] && [ ! -f "$VERDICT" ]; then
            echo "FAIL: verdict output '$VERDICT' is set but file does not exist"
            exit 1
          fi

          # Status must be a number
          if ! echo "$STATUS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: status '$STATUS' is not a number"
            exit 1
          fi

          echo "PASS: action produced valid outputs (result=$RESULT, status=$STATUS)"
