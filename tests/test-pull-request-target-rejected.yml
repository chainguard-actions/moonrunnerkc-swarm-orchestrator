name: Test pull_request_target event is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: pull_request_target
        with:
          workspace: ${{ github.workspace }}
          branch: act-harness
          base: HEAD~1
      - name: Assert action rejected pull_request_target event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action explicitly throws when GITHUB_EVENT_NAME=pull_request_target
          # OR when RUNNER_ENVIRONMENT != 'github-hosted'. Either way it must fail.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected the privileged event or non-hosted runner"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have rejected pull_request_target or non-hosted runner"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
