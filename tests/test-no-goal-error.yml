name: Test missing goal fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          goal: ''
        continue-on-error: true
      - name: Assert action failed when no goal provided
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when goal is empty, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no goal was provided"
