name: Test missing goal error handling
on:
  workflow_dispatch:
jobs:
  test-missing-goal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action without a goal (should fail)
        id: action
        uses: .
        with:
          goal: ""
        continue-on-error: true
      - name: Assert action failed with missing goal
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when goal is empty, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when goal was not provided"
