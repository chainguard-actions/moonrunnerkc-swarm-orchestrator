name: Test contract-only mode (compile goal without executing)
on:
  workflow_dispatch:
jobs:
  test-contract-only:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          goal: 'Write a function that adds two numbers'
          contract-only: 'true'
          extractor: 'deterministic'
        continue-on-error: true

      - name: Assert action ran (contract-only mode)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          # The action must have run (success or failure) — skipped means it never started
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — it should have run"
            exit 1
          fi
          echo "PASS: action ran with outcome '$OUTCOME' (contract-only mode)"
