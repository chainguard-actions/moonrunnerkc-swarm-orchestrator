name: Test contract-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          goal: 'Add a hello world function to the codebase'
          contract-only: 'true'
        continue-on-error: true
      - name: Assert action ran (contract-only mode exits after compile)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # contract-only mode compiles the goal into a contract.
          # The CLI may exit 0 (success) or non-zero if the compile step
          # itself has an issue, but the action must at least start and
          # attempt the compile step (not fail at the shell validation layer).
          # We accept both success and failure from the CLI itself, but
          # we must NOT see the shell-level "Error: goal must be provided" path.
          echo "PASS: action reached the CLI compile step"
