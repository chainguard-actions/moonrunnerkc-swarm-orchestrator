name: Test contract-only mode (compile goal, no execution)
on:
  workflow_dispatch:

jobs:
  test-contract-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness || true
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: contract
        uses: .
        continue-on-error: true
        with:
          goal: 'Write a function that adds two integers and returns the sum.'
          contract-only: 'true'
          extractor: 'deterministic'

      - name: Assert contract-only ran (pass or fail gracefully)
        env:
          OUTCOME: ${{ steps.contract.outcome }}
          RESULT: ${{ steps.contract.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: contract-only completed successfully"
            if [ -n "$RESULT" ]; then
              echo "result output: $RESULT"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without LLM API key or under sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
