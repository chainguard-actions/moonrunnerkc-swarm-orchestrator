name: Test swarm-verify refused when fetch fails for supplied head and base
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Capture head and base SHAs
        id: refs
        run: |
          HEAD=$(git rev-parse HEAD)
          # Use HEAD~1 if available, otherwise use HEAD itself as base
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            BASE=$(git rev-parse HEAD~1)
          else
            BASE=$HEAD
          fi
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head: $HEAD"
          echo "base: $BASE"

      - id: action
        uses: .
        continue-on-error: true
        with:
          isolation: host
          comment: "false"
          attest: "false"
          allow-self-hosted: "true"
          head: ${{ steps.refs.outputs.head }}
          base: ${{ steps.refs.outputs.base }}
          # source-url points to a non-existent repo so fetch will fail → refused
          source-url: "https://github.com/nonexistent-org-swarm-test/nonexistent-repo-swarm-test.git"

      - name: Assert action refused gracefully when fetch fails
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result:  $RESULT"
          echo "status:  $STATUS"
          # The action must fail (exit non-zero for refused)
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (refused when fetch fails), got outcome=$OUTCOME"
            exit 1
          fi
          # If the result output is available, it must be 'refused'
          # (composite action outputs may not be set when the action fails under act)
          if [ -n "$RESULT" ] && [ "$RESULT" != "refused" ]; then
            echo "FAIL: expected result=refused, got '$RESULT'"
            exit 1
          fi
          echo "PASS: action failed as expected (result=${RESULT:-not-available})"
