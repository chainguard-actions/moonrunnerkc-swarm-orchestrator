name: Test audit mode with clean diff (expect pass)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean diff with no suspicious patterns
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.swarm-test"
          cat > "$GITHUB_WORKSPACE/.swarm-test/clean.diff" <<'EOF'
          --- a/README.md
          +++ b/README.md
          @@ -1,3 +1,4 @@
           # My Project
           
           A simple project.
          +Updated documentation.
          EOF

      - id: action
        uses: .
        with:
          audit-mode: 'true'
          diff-file: '/github/workspace/.swarm-test/clean.diff'
          audit-comment: 'false'
          result-path: '/tmp/swarm-result-clean.json'
        continue-on-error: true

      - name: Assert audit outputs
        env:
          AUDIT_PASS: ${{ steps.action.outputs.audit-pass }}
          FINDINGS: ${{ steps.action.outputs.audit-findings }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "audit-pass: $AUDIT_PASS"
          echo "audit-findings: $FINDINGS"
          if [ -z "$AUDIT_PASS" ]; then
            echo "INFO: audit-pass not set — action may not have produced outputs (outcome=$OUTCOME)"
            echo "PASS: skipping output assertions"
          else
            if [ "$AUDIT_PASS" != "true" ] && [ "$AUDIT_PASS" != "false" ]; then
              echo "FAIL: audit-pass must be 'true' or 'false', got: '$AUDIT_PASS'"
              exit 1
            fi
            echo "PASS: audit-pass=$AUDIT_PASS findings=$FINDINGS"
          fi

      - name: Assert audit-ledger output
        env:
          LEDGER: ${{ steps.action.outputs.audit-ledger }}
        run: |
          echo "audit-ledger: $LEDGER"
          if [ -n "$LEDGER" ]; then
            echo "PASS: audit-ledger path reported: $LEDGER"
          else
            echo "INFO: audit-ledger not set (no findings ledger written)"
            echo "PASS"
          fi
