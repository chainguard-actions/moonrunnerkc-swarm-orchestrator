name: Test contract-only with missing goal error
on:
  workflow_dispatch:
jobs:
  test-contract-only-missing-goal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with contract-only=true but no goal (should fail)
        id: action
        uses: .
        with:
          goal: ""
          contract-only: "true"
        continue-on-error: true
      - name: Assert action failed when contract-only=true and goal is empty
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when contract-only=true and goal is empty, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when contract-only=true but goal was not provided"
