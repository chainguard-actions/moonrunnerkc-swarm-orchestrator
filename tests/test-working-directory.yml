name: Test working-directory and repo-root inputs
on:
  workflow_dispatch:
jobs:
  test-working-directory:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a working directory with a diff file
        run: |
          mkdir -p /tmp/swarm-workdir
          echo '{"name": "test-project"}' > /tmp/swarm-workdir/package.json
          cat > /tmp/swarm-workdir/test.diff <<'EOF'
          --- a/src/utils.ts
          +++ b/src/utils.ts
          @@ -1,3 +1,3 @@
           export function noop() {
          -  return undefined;
          +  return null;
           }
          EOF

      - id: action
        uses: .
        with:
          audit-mode: 'true'
          diff-file: '/tmp/swarm-workdir/test.diff'
          audit-comment: 'false'
          working-directory: '/tmp/swarm-workdir'
          repo-root: '/tmp/swarm-workdir'
          result-path: '/tmp/swarm-result-workdir.json'
        continue-on-error: true

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action did not produce an outcome"
            exit 1
          fi
          echo "PASS: action ran with outcome '$OUTCOME'"
