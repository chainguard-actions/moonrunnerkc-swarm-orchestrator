name: Test audit mode with pr input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - name: Create a fake diff file for audit
        run: |
          cat > /tmp/test-pr.diff <<'EOF'
          --- a/foo.py
          +++ b/foo.py
          @@ -1,3 +1,3 @@
          -def test_foo():
          -    assert True
          +def test_foo():
          +    assert 1 == 1
          EOF
      - id: action
        uses: .
        with:
          audit-mode: 'true'
          pr: '1'
          diff-file: '/tmp/test-pr.diff'
          audit-comment: 'false'
        continue-on-error: true
      - name: Assert action ran (pr input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail due to no real PR, but it must have started
          # (not a configuration/input-parsing error). We accept success or failure.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: pr input was accepted and action ran"
