name: Test swarm-verify with pre-prepared workspace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Resolve head and base commits
        id: commits
        run: |
          HEAD=$(git rev-parse HEAD)
          BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "HEAD: $HEAD"
          echo "BASE: $BASE"
      # Provide the current workspace as the pre-prepared checkout.
      # The action skips the fetch step and runs the verifier directly.
      # With host isolation and no oracle/contract, it will produce a regression-only
      # or incomplete result (no candidate commands to run), not a refusal.
      - id: action
        uses: .
        continue-on-error: true
        with:
          isolation: host
          comment: "false"
          attest: "false"
          allow-self-hosted: "true"
          workspace: ${{ github.workspace }}
          head: ${{ steps.commits.outputs.head }}
          base: ${{ steps.commits.outputs.base }}
      - name: Assert action ran with workspace mode
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
          HEAD_OUT: ${{ steps.action.outputs.head }}
          BASE_OUT: ${{ steps.action.outputs.base }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          VERDICT_DIGEST: ${{ steps.action.outputs.verdict-digest }}
        run: |
          echo "outcome:        $OUTCOME"
          echo "result:         $RESULT"
          echo "status:         $STATUS"
          echo "head:           $HEAD_OUT"
          echo "base:           $BASE_OUT"
          echo "verdict:        $VERDICT"
          echo "verdict-digest: $VERDICT_DIGEST"

          # The action must have produced a verdict (not just crashed without outputs)
          if [ -z "$RESULT" ]; then
            echo "FAIL: result output is empty — action did not produce a verdict"
            exit 1
          fi

          # head and base outputs must match what we supplied
          if [ -z "$HEAD_OUT" ]; then
            echo "FAIL: head output is empty"
            exit 1
          fi
          if [ -z "$BASE_OUT" ]; then
            echo "FAIL: base output is empty"
            exit 1
          fi

          # verdict-digest must be set and properly formatted
          if [ -z "$VERDICT_DIGEST" ]; then
            echo "FAIL: verdict-digest output is empty"
            exit 1
          fi
          if ! echo "$VERDICT_DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "FAIL: verdict-digest format invalid: '$VERDICT_DIGEST'"
            exit 1
          fi

          # Acceptable results: verified, not-verified, incomplete, regression-only, refused
          case "$RESULT" in
            verified|not-verified|incomplete|regression-only|refused)
              echo "PASS: action produced verdict result='$RESULT' in workspace mode"
              ;;
            *)
              echo "FAIL: unexpected result '$RESULT'"
              exit 1
              ;;
          esac
