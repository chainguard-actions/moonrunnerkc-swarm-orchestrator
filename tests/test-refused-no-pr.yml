name: Test refused when no PR context and no head/base
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          isolation: host
          comment: "false"
          attest: "false"
          allow-self-hosted: "true"
          # No head, no base, no workspace — workflow_dispatch carries no PR

      - name: Assert action refused or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result:  $RESULT"
          echo "status:  $STATUS"
          # The action must not succeed: without a PR context and without head/base,
          # it should refuse (exit 4) or fail during build/setup.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail (refused) but it succeeded"
            exit 1
          fi
          # outcome=failure is the expected path (refused → exit 4, or build failure → exit non-zero)
          echo "PASS: action did not succeed (outcome=$OUTCOME) — refused or failed as expected"
          # If outputs were set, verify the result is 'refused'
          if [ -n "$RESULT" ]; then
            if [ "$RESULT" != "refused" ]; then
              echo "FAIL: expected result='refused' but got '$RESULT'"
              exit 1
            fi
            echo "PASS: result='refused' as expected"
          else
            echo "INFO: result output not set (action may have failed before producing a verdict)"
          fi
