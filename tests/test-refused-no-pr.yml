name: Test swarm-verify refused when no PR and no head/base
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The action refuses when there is no pull request event and no head/base inputs.
      # It writes a verdict with result=refused and status=4, then the final step exits 4.
      # The composite action fails; continue-on-error lets the assertion step run.
      - id: action
        uses: .
        continue-on-error: true
        with:
          isolation: host
          comment: "false"
          attest: "false"
          allow-self-hosted: "true"
      - name: Assert result is refused
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result:  $RESULT"
          echo "status:  $STATUS"
          # The action should have failed (exit 4 from the final step)
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (exit 4 for refused), got outcome=$OUTCOME"
            exit 1
          fi
          # The verdict should record result=refused
          if [ "$RESULT" != "refused" ]; then
            echo "FAIL: expected result=refused, got '$RESULT'"
            exit 1
          fi
          # Status 4 means incomplete/refused
          if [ "$STATUS" != "4" ]; then
            echo "FAIL: expected status=4, got '$STATUS'"
            exit 1
          fi
          echo "PASS: action refused gracefully as expected"
