name: Test audit mode with AI-BOM emission
on:
  workflow_dispatch:

jobs:
  test-audit-aibom:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/7/merge
      GITHUB_HEAD_REF: ai-feature
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Write a minimal diff for audit
        run: |
          mkdir -p /tmp/swarm-aibom-test
          cat > /tmp/swarm-aibom-test/patch.diff << 'EOF'
          --- a/lib/utils.py
          +++ b/lib/utils.py
          @@ -0,0 +1,4 @@
          +def greet(name: str) -> str:
          +    """Return a greeting string."""
          +    return f"Hello, {name}!"
          EOF

      - id: action
        uses: .
        with:
          audit-mode: 'true'
          diff-file: '/tmp/swarm-aibom-test/patch.diff'
          audit-comment: 'false'
          emit-aibom: 'cyclonedx-ml'
          result-path: '/tmp/swarm-aibom-result.json'
        continue-on-error: true

      - name: Assert step ran and aibom directory created on success
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "outcome: $OUTCOME"
          echo "audit-pass:     ${{ steps.action.outputs.audit-pass }}"
          echo "audit-findings: ${{ steps.action.outputs.audit-findings }}"
          echo "audit-ledger:   ${{ steps.action.outputs.audit-ledger }}"

          if [ -z "$OUTCOME" ]; then
            echo "FAIL: step never ran"
            exit 1
          fi

          if [ "$OUTCOME" = "success" ]; then
            if [ -d ".swarm/aibom" ]; then
              echo "PASS: .swarm/aibom/ directory was created"
            else
              echo "INFO: .swarm/aibom/ not found — may be written to a different path"
            fi
          else
            echo "SKIP: action outcome=$OUTCOME — skipping aibom directory check"
          fi
          echo "PASS: step ran with outcome '$OUTCOME'"
