name: Test local provider inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          goal: 'write a hello world function'
          extractor: 'local'
          session: 'local'
          local-backend: 'openai-compatible'
          local-base-url: 'http://localhost:11434'
          local-grammar: 'auto'
          local-model-extractor: 'mistral'
          local-model-session: 'mistral'
          result-path: '/tmp/swarm-result-local.json'
      - name: Assert action ran (local provider inputs accepted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail (no real local backend), but it must
          # have been invoked — outcome will be 'failure' not 'skipped'.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, inputs were not accepted"
            exit 1
          fi
          echo "PASS: action was invoked with local provider inputs"
