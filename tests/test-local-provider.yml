name: Test local provider settings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          goal: "write a hello world function"
          extractor: local
          session: local
          local-backend: openai-compatible
          local-base-url: "http://localhost:11434"
          local-model-extractor: "llama3"
          local-model-session: "llama3"
          local-grammar: auto
      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with no local backend available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
