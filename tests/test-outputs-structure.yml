name: Test action outputs structure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get HEAD and parent commit SHAs
        id: commits
        run: |
          HEAD=$(git rev-parse HEAD)
          BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          workspace: ${{ github.workspace }}
          head: ${{ steps.commits.outputs.head }}
          base: ${{ steps.commits.outputs.base }}
          isolation: host
          comment: "false"
          attest: "false"
          allow-self-hosted: "true"

      - name: Assert outputs are populated
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          HEAD_OUT: ${{ steps.action.outputs.head }}
          BASE_OUT: ${{ steps.action.outputs.base }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          REPORT: ${{ steps.action.outputs.report }}
          EVIDENCE: ${{ steps.action.outputs.evidence }}
          ARTIFACT: ${{ steps.action.outputs.artifact }}
          VERDICT_DIGEST: ${{ steps.action.outputs.verdict-digest }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          echo "status: $STATUS"
          echo "head: $HEAD_OUT"
          echo "base: $BASE_OUT"
          echo "verdict: $VERDICT"
          echo "report: $REPORT"
          echo "evidence: $EVIDENCE"
          echo "artifact: $ARTIFACT"
          echo "verdict-digest: $VERDICT_DIGEST"

          if [ "$OUTCOME" != "failure" ] && [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

          # The action should always set these core outputs when it runs to completion
          FAILED=0
          if [ -z "$RESULT" ]; then
            echo "FAIL: result output is empty"
            FAILED=1
          else
            echo "OK: result='$RESULT'"
          fi

          if [ -z "$HEAD_OUT" ]; then
            echo "FAIL: head output is empty"
            FAILED=1
          else
            echo "OK: head='$HEAD_OUT'"
          fi

          if [ -z "$BASE_OUT" ]; then
            echo "FAIL: base output is empty"
            FAILED=1
          else
            echo "OK: base='$BASE_OUT'"
          fi

          if [ -z "$ARTIFACT" ]; then
            echo "FAIL: artifact output is empty"
            FAILED=1
          else
            echo "OK: artifact='$ARTIFACT'"
          fi

          if [ -z "$VERDICT_DIGEST" ]; then
            echo "FAIL: verdict-digest output is empty"
            FAILED=1
          else
            echo "OK: verdict-digest='$VERDICT_DIGEST'"
          fi

          # Validate result is one of the known values
          case "$RESULT" in
            verified|not-verified|incomplete|head-changed|refused|regression-only)
              echo "OK: result is a valid value"
              ;;
            *)
              echo "FAIL: result '$RESULT' is not a known value"
              FAILED=1
              ;;
          esac

          # Validate status is numeric
          if echo "$STATUS" | grep -qE '^[0-9]+$'; then
            echo "OK: status is numeric"
          else
            echo "FAIL: status '$STATUS' is not numeric"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "PASS: all expected outputs are populated"
