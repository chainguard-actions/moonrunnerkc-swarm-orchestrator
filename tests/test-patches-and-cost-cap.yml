name: Test external patches and cost-cap inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create stub patch files
        run: |
          mkdir -p /tmp/patches-dir
          touch /tmp/patches-queue.jsonl
      - id: action
        uses: .
        continue-on-error: true
        with:
          goal: "write a hello world function"
          extractor: deterministic
          session: deterministic
          external-patches-queue: "/tmp/patches-queue.jsonl"
          external-patches-dir: "/tmp/patches-dir"
          cost-cap: "1000"
          contract-only: "true"
      - name: Assert action ran (patches and cost-cap inputs accepted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may fail (deterministic session with empty patches),
          # but it must have started without YAML/input-parsing errors.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: external-patches-queue, external-patches-dir, and cost-cap inputs were accepted"
