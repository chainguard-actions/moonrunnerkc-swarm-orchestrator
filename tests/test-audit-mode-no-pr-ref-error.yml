name: Test audit-mode without PR reference fails
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in audit-mode without pr or diff-file (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          audit-mode: 'true'
          # No pr, no diff-file, and no pull_request event context
          # The entrypoint should exit 2 with an error message

      - name: Assert action failed due to missing PR reference
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when audit-mode=true but no PR ref is available"
            exit 1
          fi
          echo "PASS: action correctly failed when audit-mode=true without a PR reference"
