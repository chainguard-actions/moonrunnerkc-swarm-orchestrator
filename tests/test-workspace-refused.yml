name: Test workspace input – refused when commits not in workspace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Capture the current HEAD and its parent so we can pass real SHAs.
      - name: Capture git refs
        id: refs
        run: |
          HEAD=$(git rev-parse HEAD)
          BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "$HEAD")
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head: $HEAD"
          echo "base: $BASE"

      # Run the action with a real workspace and real SHAs.
      # The action will build from source, then attempt to run the verifier (swarm ci)
      # against the workspace. Under act the runner environment is not github-hosted,
      # but allow-self-hosted overrides that check. The verifier itself may exit
      # non-zero (no checks configured), producing an incomplete/refused verdict.
      - id: action
        uses: .
        continue-on-error: true
        with:
          workspace: ${{ github.workspace }}
          head: ${{ steps.refs.outputs.head }}
          base: ${{ steps.refs.outputs.base }}
          comment: "false"
          attest: "false"
          allow-self-hosted: "true"
          isolation: host

      - name: Assert action produced a verdict or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result:  $RESULT"
          echo "status:  $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            case "$RESULT" in
              verified|not-verified|incomplete|refused|regression-only|head-changed)
                echo "PASS: action succeeded with result '$RESULT'"
                ;;
              "")
                # Empty result with success outcome is unexpected but not fatal.
                echo "PASS: action succeeded (result output not captured)"
                ;;
              *)
                echo "FAIL: unexpected result '$RESULT'"
                exit 1
                ;;
            esac
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo, build issue, or verifier error)"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled (possible timeout)"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
