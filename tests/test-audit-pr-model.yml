name: Test audit mode with pr and model inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          audit-mode: "true"
          pr: "1"
          model: "claude-3-5-sonnet-20241022"
          audit-comment: "false"
      - name: Assert action ran (pr and model inputs accepted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may fail (no real PR or API key), but it must have
          # started without YAML/input-parsing errors.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: pr and model inputs were accepted"
