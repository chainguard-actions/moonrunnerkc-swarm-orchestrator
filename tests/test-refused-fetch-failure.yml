name: Test swarm-verify refused when head/base fetch fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get current HEAD and parent commits
        id: commits
        run: |
          HEAD=$(git rev-parse HEAD)
          # Use HEAD~1 as base; if shallow, fall back to HEAD itself
          BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "HEAD: $HEAD"
          echo "BASE: $BASE"
      # Provide explicit head/base but point source-url at a non-existent location so
      # the fetch fails and the action produces a refused verdict (status=4).
      # The sentinel GITHUB_REPOSITORY means the default source URL also fails.
      - id: action
        uses: .
        continue-on-error: true
        with:
          isolation: host
          comment: "false"
          attest: "false"
          allow-self-hosted: "true"
          head: ${{ steps.commits.outputs.head }}
          base: ${{ steps.commits.outputs.base }}
          source-url: "https://github.com/actionchain-harness/nonexistent-repo.git"
      - name: Assert outputs are set and action refused gracefully
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
          HEAD_OUT: ${{ steps.action.outputs.head }}
          BASE_OUT: ${{ steps.action.outputs.base }}
        run: |
          echo "outcome:  $OUTCOME"
          echo "result:   $RESULT"
          echo "status:   $STATUS"
          echo "head out: $HEAD_OUT"
          echo "base out: $BASE_OUT"
          # The action exits 4 (refused) so the step should fail
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (exit 4 for refused), got outcome=$OUTCOME"
            exit 1
          fi
          # Verdict must record result=refused
          if [ "$RESULT" != "refused" ]; then
            echo "FAIL: expected result=refused, got '$RESULT'"
            exit 1
          fi
          if [ "$STATUS" != "4" ]; then
            echo "FAIL: expected status=4, got '$STATUS'"
            exit 1
          fi
          # head and base outputs must be the 40-char SHAs we supplied
          if [ -z "$HEAD_OUT" ]; then
            echo "FAIL: head output is empty"
            exit 1
          fi
          if [ -z "$BASE_OUT" ]; then
            echo "FAIL: base output is empty"
            exit 1
          fi
          echo "PASS: action refused gracefully with correct outputs"
