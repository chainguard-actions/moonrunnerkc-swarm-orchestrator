name: Test contract-file and contract-module inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal contract file
        run: |
          mkdir -p /tmp/swarm-contract
          cat > /tmp/swarm-contract/contract.yaml <<'EOF'
          version: "1"
          goal: "write a hello world function"
          obligations: []
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          goal: "write a hello world function"
          extractor: deterministic
          session: deterministic
          contract-file: "/tmp/swarm-contract/contract.yaml"
          contract-module: "/tmp/swarm-contract/contract.js"
      - name: Assert action ran (contract-file and contract-module inputs accepted)
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action accepted contract-file and contract-module inputs and ran"
