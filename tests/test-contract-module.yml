name: Test contract-module input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a stub contract module
        run: |
          cat > /tmp/stub-contract-module.js << 'EOF'
          module.exports = {
            obligations: []
          };
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          goal: "write a hello world function"
          extractor: deterministic
          session: deterministic
          contract-module: "/tmp/stub-contract-module.js"
          contract-only: "true"
      - name: Assert action ran (contract-module input accepted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may fail (stub module may not be valid), but it must
          # have started without YAML/input-parsing errors.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: contract-module input was accepted"
