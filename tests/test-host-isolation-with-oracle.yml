name: Test swarm-verify with host isolation and passing oracle
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve real head and base commits
        id: commits
        run: |
          HEAD=$(git rev-parse HEAD)
          BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head: $HEAD"
          echo "base: $BASE"

      - id: action
        uses: .
        continue-on-error: true
        with:
          allow-self-hosted: "true"
          comment: "false"
          attest: "false"
          isolation: host
          workspace: ${{ github.workspace }}
          head: ${{ steps.commits.outputs.head }}
          base: ${{ steps.commits.outputs.base }}
          oracle: "true"

      - name: Assert action produced a verdict with oracle result
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          VERDICT_DIGEST: ${{ steps.action.outputs.verdict-digest }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome:        $OUTCOME"
          echo "result:         $RESULT"
          echo "status:         $STATUS"
          echo "verdict:        $VERDICT"
          echo "verdict-digest: $VERDICT_DIGEST"

          # If result is empty, the build or setup failed before the verify step ran.
          if [ -z "$RESULT" ]; then
            if [ "$OUTCOME" = "success" ]; then
              echo "FAIL: action succeeded but result output is empty"
              exit 1
            fi
            echo "WARN: result is empty — the action failed before producing a verdict (likely build failure)"
            echo "PASS: action failed (outcome=failure); build may have failed under act"
            exit 0
          fi

          # Result must be one of the known values
          case "$RESULT" in
            verified|not-verified|incomplete|refused|regression-only|head-changed)
              echo "PASS: result is a known value: $RESULT"
              ;;
            *)
              echo "FAIL: unexpected result value: $RESULT"
              exit 1
              ;;
          esac

          # Verdict digest must be set and look like a sha256 digest
          if [ -z "$VERDICT_DIGEST" ]; then
            echo "FAIL: verdict-digest output is empty"
            exit 1
          fi
          if ! echo "$VERDICT_DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "FAIL: verdict-digest '$VERDICT_DIGEST' does not look like sha256:hex"
            exit 1
          fi

          echo "PASS: action produced a verdict with digest $VERDICT_DIGEST (result=$RESULT)"
