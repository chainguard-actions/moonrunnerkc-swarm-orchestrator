name: Test external patches and contract-module inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create patch queue and watched dir fixtures
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.swarm/patches-queue"
          mkdir -p "$GITHUB_WORKSPACE/.swarm/patches-dir"
          # Create a minimal JSONL patch envelope
          echo '{"id":"patch-001","type":"file","path":"hello.py","content":"def hello():\n    return \"hello world\"\n"}' \
            > "$GITHUB_WORKSPACE/.swarm/patches-queue/patches.jsonl"

      - id: action
        uses: .
        continue-on-error: true
        with:
          goal: "write a hello world function"
          extractor: deterministic
          session: deterministic
          contract-module: "hardened/tests/fixtures/contract-module.js"
          external-patches-queue: ".swarm/patches-queue/patches.jsonl"
          external-patches-dir: ".swarm/patches-dir"
          contract-only: "true"

      - name: Assert action ran (patches and contract-module inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with external-patches and contract-module inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
