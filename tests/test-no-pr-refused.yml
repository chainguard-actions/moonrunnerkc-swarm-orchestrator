name: Test swarm-verify refused without PR or head/base
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # No head/base provided, no PR event → action should refuse gracefully
          comment: "false"
          attest: "false"
          allow-self-hosted: "true"

      - name: Assert action refused gracefully
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          echo "status: $STATUS"
          # The action should fail (exit 4) because it refuses without a PR or head/base
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (refused without PR or head/base)"
          elif [ "$OUTCOME" = "success" ]; then
            # If it somehow succeeded, check the result is refused or incomplete
            if [ "$RESULT" = "refused" ] || [ "$RESULT" = "incomplete" ]; then
              echo "PASS: action completed with result=$RESULT"
            else
              echo "FAIL: unexpected result '$RESULT' (expected refused or incomplete)"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
