name: Test audit mode with diff file
on:
  workflow_dispatch:
jobs:
  test-audit-diff:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a sample diff file
        run: |
          mkdir -p /tmp/swarm-test
          cat > /tmp/swarm-test/sample.diff <<'EOF'
          --- a/src/foo.test.ts
          +++ b/src/foo.test.ts
          @@ -1,5 +1,5 @@
           describe('foo', () => {
          -  it('should return 42', () => {
          -    expect(foo()).toBe(42);
          +  it('should return 42', () => {
          +    expect(true).toBe(true);
           });
           });
          EOF

      - id: action
        uses: .
        with:
          audit-mode: 'true'
          diff-file: '/tmp/swarm-test/sample.diff'
          audit-comment: 'false'
        continue-on-error: true

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action did not produce an outcome"
            exit 1
          fi
          echo "PASS: action ran with outcome '$OUTCOME'"

      - name: Report audit outputs if available
        env:
          AUDIT_PASS: ${{ steps.action.outputs.audit-pass }}
          AUDIT_FINDINGS: ${{ steps.action.outputs.audit-findings }}
        run: |
          echo "audit-pass: $AUDIT_PASS"
          echo "audit-findings: $AUDIT_FINDINGS"
          echo "INFO: outputs reported (may be empty if Docker build or CLI failed)"
