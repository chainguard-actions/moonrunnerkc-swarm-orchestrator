name: Test external patches inputs (queue and dir)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - name: Create fake patches queue and dir
        run: |
          mkdir -p /tmp/swarm-patches-dir
          touch /tmp/swarm-patches-queue.jsonl
          echo '{"patch":"","meta":{}}' >> /tmp/swarm-patches-queue.jsonl
      - id: action
        uses: .
        with:
          goal: 'write a hello world function'
          extractor: 'deterministic'
          session: 'deterministic'
          external-patches-queue: '/tmp/swarm-patches-queue.jsonl'
          external-patches-dir: '/tmp/swarm-patches-dir'
        continue-on-error: true
      - name: Assert action ran with external patches inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail due to patch format issues, but it must not be skipped.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: external-patches-queue and external-patches-dir inputs were accepted"
