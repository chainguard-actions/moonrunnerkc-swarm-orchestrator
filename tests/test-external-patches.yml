name: Test external patches inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create patch queue and dir
        run: |
          mkdir -p /tmp/swarm-patches/queue
          mkdir -p /tmp/swarm-patches/dir
          # Write a minimal patch envelope to the queue
          echo '{"patch":"","meta":{}}' > /tmp/swarm-patches/queue/patches.jsonl
      - id: action
        uses: .
        with:
          goal: "test external patches configuration"
          session: "deterministic"
          external-patches-queue: "/tmp/swarm-patches/queue/patches.jsonl"
          external-patches-dir: "/tmp/swarm-patches/dir"
        continue-on-error: true
      - name: Assert action ran with external patches inputs
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with external patches inputs"
