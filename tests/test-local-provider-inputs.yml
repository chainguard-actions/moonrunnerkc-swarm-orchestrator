name: Test local provider inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          goal: "write a hello world function"
          extractor: deterministic
          session: deterministic
          local-backend: openai-compatible
          local-base-url: "http://localhost:11434"
          local-grammar: auto
          local-model-extractor: "llama3"
          local-model-session: "llama3"
      - name: Assert action ran (local provider inputs accepted)
        run: |
          # The action may fail because there's no real local backend,
          # but it must have started (outcome is not skipped).
          OUTCOME="${{ steps.action.outcome }}"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action accepted local provider inputs and ran"
