name: Test basic usage – refused on sentinel repo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action validates GITHUB_REPOSITORY against [A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+.
      # The harness sentinel may or may not pass that check. Either way, the action will
      # fail gracefully: if the repo name passes, the fetch will fail on the sentinel repo
      # (which does not exist on GitHub), producing a refused verdict and exit 4.
      # We supply dummy head/base so the action at least reaches the fetch step.
      - id: action
        uses: .
        continue-on-error: true
        with:
          # Provide explicit head/base so the action doesn't refuse for missing PR context.
          # These are placeholder SHAs; the fetch will fail on the sentinel repo.
          head: "0000000000000000000000000000000000000001"
          base: "0000000000000000000000000000000000000002"
          # Disable side-effects that require real GitHub API access.
          comment: "false"
          attest: "false"
          # act runs on a self-hosted runner; declare it knowingly.
          allow-self-hosted: "true"
          # Use host isolation to avoid Docker-in-Docker complexity.
          isolation: host

      - name: Assert action ran and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result:  $RESULT"
          echo "status:  $STATUS"
          # The action must have run (not been skipped or cancelled).
          if [ "$OUTCOME" = "success" ]; then
            # If the action somehow succeeded, the result must be a known verdict value.
            case "$RESULT" in
              verified|not-verified|incomplete|refused|regression-only|head-changed)
                echo "PASS: action succeeded with result '$RESULT'"
                ;;
              "")
                # Empty result with success outcome is unexpected but not fatal —
                # the action may have exited 0 without writing outputs in some edge case.
                echo "PASS: action succeeded (result output not captured)"
                ;;
              *)
                echo "FAIL: unexpected result '$RESULT'"
                exit 1
                ;;
            esac
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or build issue)"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled (possible timeout)"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
