name: Test verdict document structure on refused verdict
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-build the action to warm npm cache
        run: |
          cd "$GITHUB_WORKSPACE"
          node --version
          npm ci --ignore-scripts
          npm run build:verify

      - id: action
        uses: .
        continue-on-error: true
        with:
          # No head/base → refused; the verdict document must still be a valid JSON object
          isolation: host
          attest: "false"
          comment: "false"
          allow-self-hosted: "true"

      - name: Assert verdict document is valid JSON with expected fields
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          RESULT: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result:  $RESULT"
          echo "verdict: $VERDICT"

          # The action should have failed (exit 4 = refused)
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (exit 4 for refused), got outcome=$OUTCOME"
            exit 1
          fi

          if [ -z "$VERDICT" ] || [ ! -f "$VERDICT" ]; then
            echo "FAIL: verdict file not found at '$VERDICT'"
            exit 1
          fi

          # Parse the verdict JSON and check required fields
          node - <<'EOF'
          const fs = require('fs');
          const verdict = JSON.parse(fs.readFileSync(process.env.VERDICT, 'utf8'));
          console.log('verdict schema:', verdict.schema);
          console.log('verdict decision.result:', verdict.decision?.result);
          console.log('verdict decision.status:', verdict.decision?.status);

          const required = ['schema', 'repository', 'head', 'base', 'verifier', 'policy', 'execution', 'decision'];
          for (const field of required) {
            if (!(field in verdict)) {
              console.error('FAIL: missing field:', field);
              process.exit(1);
            }
          }

          if (verdict.decision.result !== 'refused') {
            console.error('FAIL: expected decision.result=refused, got', verdict.decision.result);
            process.exit(1);
          }

          if (verdict.decision.status !== 4) {
            console.error('FAIL: expected decision.status=4, got', verdict.decision.status);
            process.exit(1);
          }

          if (!verdict.schema || !verdict.schema.includes('swarm')) {
            console.error('FAIL: unexpected schema value:', verdict.schema);
            process.exit(1);
          }

          console.log('PASS: verdict document is valid with all required fields');
          EOF
