name: Test audit mode with diff-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a minimal unified diff file for audit
        run: |
          cat > /tmp/test.diff << 'EOF'
          --- a/src/foo.test.ts
          +++ b/src/foo.test.ts
          @@ -1,5 +1,5 @@
           describe('foo', () => {
          -  it('should return 42', () => {
          -    expect(foo()).toBe(42);
          +  it('should return 42', () => {
          +    expect(true).toBe(true);
           });
           });
          EOF

      - name: Run action in audit mode with diff-file (expect it to attempt audit)
        id: action
        uses: .
        continue-on-error: true
        with:
          audit-mode: "true"
          diff-file: "/tmp/test.diff"
          audit-comment: "false"

      - name: Assert action attempted audit (not a config validation error)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should have attempted to run the audit CLI.
          # It may fail if the CLI itself errors on the diff content,
          # but it must NOT fail with the "no PR ref" validation error.
          # Either success (audit passed) or failure (CLI error on diff) is acceptable —
          # what matters is that the diff-file path was accepted and audit was invoked.
          echo "PASS: action accepted diff-file input and attempted audit (outcome: ${{ steps.action.outcome }})"
