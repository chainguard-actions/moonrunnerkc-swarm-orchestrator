name: Test custom result-path output
on:
  workflow_dispatch:

jobs:
  test-custom-result-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness || true
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a minimal unified diff fixture
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/noop.diff" <<'EOF'
          --- a/README.md
          +++ b/README.md
          @@ -1,3 +1,3 @@
           # Project
          -Old description.
          +New description.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          audit-mode: 'true'
          diff-file: '${{ github.workspace }}/tests/fixtures/noop.diff'
          audit-comment: 'false'
          result-path: '/tmp/custom-swarm-result.json'

      - name: Assert action ran with custom result-path (pass or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
          AUDIT_PASS: ${{ steps.action.outputs.audit-pass }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          echo "audit-pass: $AUDIT_PASS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$AUDIT_PASS" ]; then
              echo "FAIL: action succeeded but audit-pass output is empty"
              exit 1
            fi
            echo "PASS: action completed with audit-pass=$AUDIT_PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo / no API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
