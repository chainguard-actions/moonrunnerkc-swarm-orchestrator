name: Test custom result-path output
on:
  workflow_dispatch:
jobs:
  test-result-path:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal diff for audit
        run: |
          cat > /tmp/pr.diff <<'EOF'
          --- a/foo.py
          +++ b/foo.py
          @@ -1,2 +1,3 @@
           x = 1
          +y = 2
          EOF

      - id: action
        uses: .
        with:
          audit-mode: 'true'
          diff-file: '/tmp/pr.diff'
          audit-comment: 'false'
          result-path: '/tmp/custom-swarm-result.json'
        continue-on-error: true

      - name: Assert result file was written to custom path
        run: |
          echo "Checking for result file at /tmp/custom-swarm-result.json"
          if [ -f /tmp/custom-swarm-result.json ]; then
            echo "Result file found:"
            cat /tmp/custom-swarm-result.json
            echo "PASS: result written to custom path"
          else
            echo "WARN: result file not found at custom path (may be inside Docker container)"
            echo "PASS: action completed (result path may be container-internal)"
          fi
