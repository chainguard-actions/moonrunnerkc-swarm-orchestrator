name: Test custom image input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          workspace: ${{ github.workspace }}
          branch: act-harness
          base: HEAD~1
          image: node:22-bookworm
      - name: Assert action ran and failed gracefully with custom image input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ARTIFACT: ${{ steps.action.outputs.artifact }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifact: $ARTIFACT"
          # Under act, RUNNER_ENVIRONMENT != 'github-hosted', so the action
          # must fail — the image input is accepted but the env check fires first.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (non-github-hosted runner)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -z "$ARTIFACT" ]; then
              echo "FAIL: action succeeded but artifact output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with artifact=$ARTIFACT"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
