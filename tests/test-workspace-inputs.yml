name: Test workspace inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare working directory
        run: |
          mkdir -p /tmp/swarm-workdir
      - id: action
        uses: .
        with:
          goal: "test workspace configuration"
          extractor: "deterministic"
          repo-root: "${{ github.workspace }}"
          working-directory: "/tmp/swarm-workdir"
        continue-on-error: true
      - name: Assert action ran with workspace inputs
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with workspace inputs"
