name: Test self-hosted guard – refused without allow-self-hosted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under act, RUNNER_ENVIRONMENT is not "github-hosted".
      # Without allow-self-hosted: true the action must refuse immediately.
      # The verify step will write a verdict with result=refused and exit 4,
      # causing the final "Return the verifier's own status" step to exit 4.
      - id: action
        uses: .
        continue-on-error: true
        with:
          head: "0000000000000000000000000000000000000001"
          base: "0000000000000000000000000000000000000002"
          comment: "false"
          attest: "false"
          # allow-self-hosted intentionally omitted (defaults to false)
          isolation: host

      - name: Assert action refused due to self-hosted runner
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result:  $RESULT"
          # The action should either:
          # (a) fail (exit 4 from the self-hosted guard → refused verdict), or
          # (b) fail at readActionContext due to invalid GITHUB_REPOSITORY sentinel, or
          # (c) fail during the build step (npm install / TypeScript compilation).
          # In all cases the step must not succeed with a non-refused result.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (self-hosted guard, sentinel repo, or build issue)"
          elif [ "$OUTCOME" = "success" ]; then
            # If somehow the action succeeded, the result must be 'refused' or empty
            # (empty can happen if act incorrectly reports success when the action failed).
            case "$RESULT" in
              refused|"")
                echo "PASS: action produced refused verdict or no result (outcome=$OUTCOME result='$RESULT')"
                ;;
              *)
                echo "FAIL: expected failure or refused verdict, got outcome=$OUTCOME result=$RESULT"
                exit 1
                ;;
            esac
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled (possible timeout)"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
