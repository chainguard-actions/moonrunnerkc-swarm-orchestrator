name: Test self-hosted runner guard (allow-self-hosted not set)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Do NOT set allow-self-hosted; under act RUNNER_ENVIRONMENT is not github-hosted
          # so the action should refuse immediately with a RefusedError
          head: "0000000000000000000000000000000000000001"
          base: "0000000000000000000000000000000000000002"
          isolation: host
          comment: "false"
          attest: "false"

      - name: Assert action refused due to self-hosted runner guard
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          echo "status: $STATUS"
          # Under act, RUNNER_ENVIRONMENT is not 'github-hosted', so without allow-self-hosted
          # the action should refuse (status 4, result=refused) and exit 4 (failure)
          if [ "$OUTCOME" = "failure" ]; then
            if [ "$RESULT" = "refused" ] || [ -z "$RESULT" ]; then
              echo "PASS: action refused as expected for non-github-hosted runner"
            else
              echo "FAIL: expected refused result but got '$RESULT'"
              exit 1
            fi
          elif [ "$OUTCOME" = "success" ]; then
            # If RUNNER_ENVIRONMENT happens to be github-hosted, the action may proceed
            # and then fail for other reasons (fetch failure) — still acceptable
            echo "PASS: action ran on a github-hosted runner (outcome=success)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
