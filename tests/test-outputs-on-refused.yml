name: Test outputs are populated even on refused verdict
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-build the action to warm npm cache
        run: |
          cd "$GITHUB_WORKSPACE"
          node --version
          npm ci --ignore-scripts
          npm run build:verify

      - id: action
        uses: .
        continue-on-error: true
        with:
          # No head/base → refused, but outputs (verdict, evidence, artifact) must still be set
          isolation: host
          attest: "false"
          comment: "false"
          allow-self-hosted: "true"

      - name: Assert outputs are populated on refused verdict
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          VERDICT_DIGEST: ${{ steps.action.outputs.verdict-digest }}
          EVIDENCE: ${{ steps.action.outputs.evidence }}
          ARTIFACT: ${{ steps.action.outputs.artifact }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome:        $OUTCOME"
          echo "result:         $RESULT"
          echo "status:         $STATUS"
          echo "verdict:        $VERDICT"
          echo "verdict-digest: $VERDICT_DIGEST"
          echo "evidence:       $EVIDENCE"
          echo "artifact:       $ARTIFACT"

          # The action should have failed (exit 4 = refused)
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (exit 4 for refused), got outcome=$OUTCOME"
            exit 1
          fi

          # result must be 'refused'
          if [ "$RESULT" != "refused" ]; then
            echo "FAIL: expected result='refused', got '$RESULT'"
            exit 1
          fi

          # status must be '4' (refused/incomplete)
          if [ "$STATUS" != "4" ]; then
            echo "FAIL: expected status='4', got '$STATUS'"
            exit 1
          fi

          # verdict path must be non-empty and the file must exist
          if [ -z "$VERDICT" ]; then
            echo "FAIL: verdict output is empty"
            exit 1
          fi
          if [ ! -f "$VERDICT" ]; then
            echo "FAIL: verdict file does not exist at '$VERDICT'"
            exit 1
          fi

          # verdict-digest must be a sha256: prefixed string
          if [ -z "$VERDICT_DIGEST" ]; then
            echo "FAIL: verdict-digest output is empty"
            exit 1
          fi
          if ! echo "$VERDICT_DIGEST" | grep -q "^sha256:"; then
            echo "FAIL: verdict-digest does not start with 'sha256:': $VERDICT_DIGEST"
            exit 1
          fi

          # evidence directory must be non-empty and exist
          if [ -z "$EVIDENCE" ]; then
            echo "FAIL: evidence output is empty"
            exit 1
          fi
          if [ ! -d "$EVIDENCE" ]; then
            echo "FAIL: evidence directory does not exist at '$EVIDENCE'"
            exit 1
          fi

          # artifact name must be non-empty
          if [ -z "$ARTIFACT" ]; then
            echo "FAIL: artifact output is empty"
            exit 1
          fi

          echo "PASS: all outputs populated correctly on refused verdict"
