name: Test audit mode with pr and model inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
      GITHUB_REPOSITORY: moonrunnerkc/swarm-orchestrator
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          audit-mode: 'true'
          pr: '1'
          model: 'claude-opus-4-5'
          audit-comment: 'false'
          result-path: '/tmp/swarm-result-pr.json'
      - name: Assert action was invoked with pr and model inputs
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, inputs were not accepted"
            exit 1
          fi
          echo "PASS: action was invoked with pr and model inputs"
