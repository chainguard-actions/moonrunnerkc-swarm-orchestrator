name: Test emit-aibom input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal diff file
        run: |
          cat > /tmp/test.diff <<'EOF'
          --- a/hello.py
          +++ b/hello.py
          @@ -1,3 +1,3 @@
           def hello():
          -    return "world"
          +    return "hello world"
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          audit-mode: "true"
          diff-file: "/tmp/test.diff"
          emit-aibom: "cyclonedx-ml"
          audit-comment: "false"
      - name: Assert action ran (emit-aibom input accepted)
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action accepted emit-aibom input and ran"
