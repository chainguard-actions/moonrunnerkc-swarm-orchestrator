name: Test audit mode with PR number input
on:
  workflow_dispatch:

jobs:
  test-audit-pr-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness || true
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: audit-pr
        uses: .
        continue-on-error: true
        with:
          audit-mode: 'true'
          pr: '1'
          audit-comment: 'false'

      - name: Assert audit-pr ran (pass or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.audit-pr.outcome }}
          AUDIT_PASS: ${{ steps.audit-pr.outputs.audit-pass }}
          AUDIT_FINDINGS: ${{ steps.audit-pr.outputs.audit-findings }}
          AUDIT_LEDGER: ${{ steps.audit-pr.outputs.audit-ledger }}
        run: |
          echo "outcome: $OUTCOME"
          echo "audit-pass: $AUDIT_PASS"
          echo "audit-findings: $AUDIT_FINDINGS"
          echo "audit-ledger: $AUDIT_LEDGER"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$AUDIT_PASS" ]; then
              echo "FAIL: action succeeded but audit-pass output is empty"
              exit 1
            fi
            echo "PASS: audit completed with audit-pass=$AUDIT_PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo cannot resolve PR #1)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
