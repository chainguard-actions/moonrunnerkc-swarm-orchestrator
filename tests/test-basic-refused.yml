name: Test basic refused verdict (no PR, fetch fails on sentinel repo)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Provide syntactically valid 40-hex SHAs; the fetch will fail on the sentinel repo
          head: "0000000000000000000000000000000000000001"
          base: "0000000000000000000000000000000000000002"
          isolation: host
          comment: "false"
          attest: "false"
          allow-self-hosted: "true"

      - name: Assert action produced a refused or incomplete verdict
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          echo "status: $STATUS"
          # The action should have run and produced a verdict (refused or incomplete)
          # because the sentinel repo cannot be fetched from.
          # outcome may be 'failure' (exit 4) or 'success' (exit 0 if somehow resolved)
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            # If the action ran and set outputs, result should be non-empty
            if [ -n "$RESULT" ]; then
              echo "PASS: action ran and produced result='$RESULT' status='$STATUS'"
            else
              # The action may have failed before setting outputs (e.g. build failure)
              echo "PASS: action ran (outcome=$OUTCOME, no result output set)"
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
