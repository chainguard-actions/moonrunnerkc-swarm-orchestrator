name: Test refused verdict when no head/base and no PR event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # No head or base provided, no PR event → action must refuse
          isolation: host
          comment: "false"
          attest: "false"
          allow-self-hosted: "true"

      - name: Assert action refused gracefully (no head/base, no PR)
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          echo "status: $STATUS"
          # Without head/base and no PR event, the action should refuse (status 4, result=refused)
          # The final step exits with status 4, so outcome should be 'failure'
          if [ "$OUTCOME" = "failure" ]; then
            if [ "$RESULT" = "refused" ] || [ -z "$RESULT" ]; then
              echo "PASS: action refused as expected (result='$RESULT')"
            else
              echo "FAIL: expected refused result but got '$RESULT'"
              exit 1
            fi
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail (refuse) but it succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
