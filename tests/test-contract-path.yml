name: Test contract-path and workspace inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a minimal contract directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.swarm/contracts/test-contract"
          cat > "$GITHUB_WORKSPACE/.swarm/contracts/test-contract/contract.json" <<'EOF'
          {
            "goal": "write a hello world function",
            "obligations": []
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          contract-path: ".swarm/contracts/test-contract"
          repo-root: "${{ github.workspace }}"
          working-directory: "${{ github.workspace }}"
          result-path: "/tmp/swarm-test-result.json"

      - name: Assert action ran (contract-path and workspace inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with contract-path inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or missing contract format)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
