name: Test contract-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal contract directory
        run: |
          mkdir -p /tmp/my-contract
          echo '{"version":"1","obligations":[]}' > /tmp/my-contract/contract.json
      - id: action
        uses: .
        continue-on-error: true
        with:
          contract-path: "/tmp/my-contract"
          extractor: deterministic
          session: deterministic
      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with minimal stub contract)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
