name: Test contract-path and repo-root inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a stub contract directory
        run: |
          mkdir -p /tmp/stub-contract
          echo '{"obligations":[]}' > /tmp/stub-contract/contract.json
      - id: action
        uses: .
        continue-on-error: true
        with:
          contract-path: "/tmp/stub-contract"
          repo-root: "${{ github.workspace }}"
          extractor: deterministic
          session: deterministic
      - name: Assert action ran (contract-path and repo-root inputs accepted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may fail (stub contract may not be valid), but it must
          # have started without YAML/input-parsing errors.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: contract-path and repo-root inputs were accepted"
