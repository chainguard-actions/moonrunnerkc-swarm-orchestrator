name: Test swarm-verify refused on non-github-hosted runner without allow-self-hosted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Do NOT set allow-self-hosted; act runner is not github-hosted so action should refuse
          comment: "false"
          attest: "false"
          # allow-self-hosted defaults to false

      - name: Assert action refused due to runner environment
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          echo "status: $STATUS"
          # Under act, RUNNER_ENVIRONMENT is not 'github-hosted', so the action should refuse
          # with result=refused and exit status 4 (causing the step to fail)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (non-github-hosted runner without allow-self-hosted)"
          elif [ "$OUTCOME" = "success" ]; then
            # If RUNNER_ENVIRONMENT happened to be github-hosted, the action may proceed
            # and then refuse for another reason (no PR, no head/base)
            if [ "$RESULT" = "refused" ] || [ "$RESULT" = "incomplete" ]; then
              echo "PASS: action completed with result=$RESULT (runner was accepted, refused for other reason)"
            else
              echo "FAIL: unexpected result '$RESULT'"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
