name: Test missing goal and contract-path error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without goal or contract-path (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          audit-mode: 'false'
          # Neither goal nor contract-path provided — should exit 1

      - name: Assert action failed with expected error
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when neither goal nor contract-path is provided"
            exit 1
          fi
          echo "PASS: action correctly failed when neither goal nor contract-path was provided"
