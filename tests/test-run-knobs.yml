name: Test run knobs inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          goal: "test run knobs configuration"
          model: "claude-3-5-sonnet-20241022"
          mode: "tournament"
          candidates: "2"
          max-obligations: "5"
          cost-cap: "1000"
        continue-on-error: true
      - name: Assert action ran with run knob inputs
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may fail due to missing API keys, but it must have
          # been invoked (not skipped). We verify the step was reached.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with run knob inputs"
