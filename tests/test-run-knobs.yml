name: Test run knob inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          goal: "write a hello world function"
          extractor: deterministic
          session: deterministic
          mode: tournament
          candidates: "2"
          max-obligations: "5"
          cost-cap: "1000"
          falsifiers: "off"
      - name: Assert action ran (run knob inputs accepted)
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action accepted run knob inputs and ran"
