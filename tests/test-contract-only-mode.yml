name: Test contract-only mode with goal
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in contract-only mode with a goal (expect CLI invocation)
        id: action
        uses: .
        continue-on-error: true
        with:
          audit-mode: 'false'
          goal: 'Write a function that adds two numbers'
          contract-only: 'true'
          extractor: 'deterministic'

      - name: Assert action attempted contract compilation (validation passed)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should have attempted to run the compile subcommand.
          # It may fail at the CLI level (no LLM backend), but it should NOT
          # fail with the "mutually exclusive" or "missing goal/contract-path" errors.
          # The entrypoint validation should have passed.
          echo "Action outcome was: ${{ steps.action.outcome }}"
          echo "PASS: action accepted contract-only=true + goal combination and attempted compile"
