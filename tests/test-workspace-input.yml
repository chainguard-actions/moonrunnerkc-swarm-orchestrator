name: Test with workspace input (pre-prepared checkout)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-build the action to warm npm cache
        run: |
          cd "$GITHUB_WORKSPACE"
          node --version
          npm ci --ignore-scripts
          npm run build:verify

      - name: Create a minimal test workspace
        id: workspace
        run: |
          WORKSPACE=/tmp/swarm-test-workspace
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"
          git init -q -b main
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Allow fetching by commit SHA
          git config uploadpack.allowReachableSHA1InWant true
          # Base commit: a simple passing test
          printf '{"name":"w","version":"1.0.0","type":"module","scripts":{"test":"node --test"}}\n' > package.json
          printf 'export const add = (a, b) => a + b;\n' > add.mjs
          printf 'import test from "node:test";\nimport assert from "node:assert/strict";\nimport {add} from "./add.mjs";\ntest("adds", () => assert.equal(add(1,2),3));\n' > add.test.mjs
          git add -A
          git commit -qm "base"
          BASE=$(git rev-parse HEAD)
          # Feature commit: add a new export (still passing)
          git checkout -q -b feature
          printf 'export const add = (a, b) => a + b;\nexport const sub = (a, b) => a - b;\n' > add.mjs
          git commit -qam "feature"
          HEAD=$(git rev-parse HEAD)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "workspace: $WORKSPACE"
          echo "head: $HEAD"
          echo "base: $BASE"

      - id: action
        uses: .
        continue-on-error: true
        with:
          workspace: ${{ steps.workspace.outputs.workspace }}
          head: ${{ steps.workspace.outputs.head }}
          base: ${{ steps.workspace.outputs.base }}
          isolation: host
          attest: "false"
          comment: "false"
          allow-self-hosted: "true"

      - name: Assert action ran and produced outputs
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          HEAD_OUT: ${{ steps.action.outputs.head }}
          BASE_OUT: ${{ steps.action.outputs.base }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          VERDICT_DIGEST: ${{ steps.action.outputs.verdict-digest }}
          EVIDENCE: ${{ steps.action.outputs.evidence }}
          ARTIFACT: ${{ steps.action.outputs.artifact }}
          OUTCOME: ${{ steps.action.outcome }}
          EXPECTED_HEAD: ${{ steps.workspace.outputs.head }}
          EXPECTED_BASE: ${{ steps.workspace.outputs.base }}
        run: |
          echo "outcome:        $OUTCOME"
          echo "result:         $RESULT"
          echo "status:         $STATUS"
          echo "head:           $HEAD_OUT"
          echo "base:           $BASE_OUT"
          echo "verdict:        $VERDICT"
          echo "verdict-digest: $VERDICT_DIGEST"
          echo "evidence:       $EVIDENCE"
          echo "artifact:       $ARTIFACT"

          # The action must have produced a verdict (either success or failure exit).
          # With a workspace + head + base, the action should proceed past the 'refused' stage.
          # It may exit 0 (verified/regression-only), 1 (not-verified), or 4 (incomplete).
          # All are acceptable — we just verify the outputs are populated.

          # verdict must be set and file must exist
          if [ -z "$VERDICT" ]; then
            echo "FAIL: verdict output is empty"
            exit 1
          fi
          if [ ! -f "$VERDICT" ]; then
            echo "FAIL: verdict file does not exist at '$VERDICT'"
            exit 1
          fi

          # verdict-digest must be sha256: prefixed
          if [ -z "$VERDICT_DIGEST" ]; then
            echo "FAIL: verdict-digest output is empty"
            exit 1
          fi
          if ! echo "$VERDICT_DIGEST" | grep -q "^sha256:"; then
            echo "FAIL: verdict-digest does not start with 'sha256:': $VERDICT_DIGEST"
            exit 1
          fi

          # head output must match what we passed in
          if [ "$HEAD_OUT" != "$EXPECTED_HEAD" ]; then
            echo "FAIL: head output '$HEAD_OUT' does not match expected '$EXPECTED_HEAD'"
            exit 1
          fi

          # base output must match what we passed in
          if [ "$BASE_OUT" != "$EXPECTED_BASE" ]; then
            echo "FAIL: base output '$BASE_OUT' does not match expected '$EXPECTED_BASE'"
            exit 1
          fi

          # result must be one of the known values
          case "$RESULT" in
            verified|not-verified|incomplete|refused|regression-only|head-changed)
              echo "PASS: result='$RESULT' is a valid verdict result"
              ;;
            *)
              echo "FAIL: unexpected result value '$RESULT'"
              exit 1
              ;;
          esac

          echo "PASS: action ran with workspace input and produced valid outputs"
