name: Test contract-only with contract-path is invalid
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with contract-only=true and contract-path (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          audit-mode: 'false'
          contract-path: '/tmp/some-contract'
          contract-only: 'true'

      - name: Assert action failed due to invalid combination
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when contract-only=true is combined with contract-path"
            exit 1
          fi
          echo "PASS: action correctly rejected contract-only=true + contract-path combination"
