name: Test deterministic extractor with contract-file
on:
  workflow_dispatch:
jobs:
  test-deterministic-extractor:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal contract file
        run: |
          mkdir -p /tmp/swarm-contracts
          cat > /tmp/swarm-contracts/contract.yaml <<'EOF'
          version: "1"
          goal: "Add two numbers"
          obligations:
            - id: ob-1
              description: "Function exists and returns correct sum"
              verifier: "assert"
          EOF

      - id: action
        uses: .
        with:
          goal: 'Add two numbers'
          contract-file: '/tmp/swarm-contracts/contract.yaml'
          extractor: 'deterministic'
          session: 'deterministic'
          contract-only: 'true'
        continue-on-error: true

      - name: Assert action ran (deterministic extractor)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          # The action must have run (success or failure) — skipped means it never started
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
