name: Test deterministic extractor with contract-file
on:
  workflow_dispatch:

jobs:
  test-deterministic-extractor:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal contract fixture file
        run: |
          mkdir -p /tmp/swarm-contracts
          cat > /tmp/swarm-contracts/contract.yaml << 'EOF'
          version: "1"
          goal: "Return the sum of two integers"
          obligations:
            - id: ob-1
              description: "Implement add(a, b) returning a + b"
              verifier: "unit-test"
          EOF

      - id: action
        uses: .
        with:
          goal: 'Return the sum of two integers'
          contract-file: '/tmp/swarm-contracts/contract.yaml'
          extractor: 'deterministic'
          session: 'deterministic'
          contract-only: 'true'
          result-path: '/tmp/swarm-result-det.json'
        continue-on-error: true

      - name: Assert step ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "result: ${{ steps.action.outputs.result }}"
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: step never ran"
            exit 1
          fi
          echo "PASS: step ran with outcome '${{ steps.action.outcome }}'"

      - name: Assert result-path is respected when action succeeds
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -f /tmp/swarm-result-det.json ]; then
              echo "FAIL: result file not written to custom result-path"
              exit 1
            fi
            echo "PASS: result file found at custom path"
          else
            echo "SKIP: action did not succeed (outcome=$OUTCOME), skipping file check"
          fi
