name: Test emit-aibom, extra-args, and model inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a minimal diff file for audit mode
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.swarm"
          cat > "$GITHUB_WORKSPACE/.swarm/test.diff" <<'EOF'
          --- a/hello.py
          +++ b/hello.py
          @@ -0,0 +1,3 @@
          +def hello():
          +    return "hello world"
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          audit-mode: "true"
          diff-file: ".swarm/test.diff"
          emit-aibom: "cyclonedx-ml"
          model: "claude-3-5-sonnet-20241022"
          extra-args: "--snapshot-cleanup always"
          audit-comment: "false"

      - name: Assert action ran (emit-aibom, model, extra-args accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          AUDIT_PASS: ${{ steps.action.outputs.audit-pass }}
          AUDIT_FINDINGS: ${{ steps.action.outputs.audit-findings }}
        run: |
          echo "outcome: $OUTCOME"
          echo "audit-pass: $AUDIT_PASS"
          echo "audit-findings: $AUDIT_FINDINGS"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with emit-aibom, model, and extra-args inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
