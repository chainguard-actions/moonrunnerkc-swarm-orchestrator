name: Test refusal when no PR and no head/base supplied
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          isolation: host
          comment: "false"
          attest: "false"
          allow-self-hosted: "true"
          # Intentionally omit head and base — the action should refuse

      - name: Assert action refused due to missing head/base
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          echo "status: $STATUS"
          # Without a PR event and without head/base inputs, the action must refuse.
          # The verify step writes result=refused and status=4, then the action exits 4.
          if [ "$OUTCOME" = "failure" ]; then
            if [ "$RESULT" = "refused" ] || [ -z "$RESULT" ]; then
              echo "PASS: action refused as expected (no PR, no head/base)"
            else
              echo "FAIL: expected refused result but got '$RESULT'"
              exit 1
            fi
          elif [ "$OUTCOME" = "success" ]; then
            # Unexpected: action should not succeed without head/base on workflow_dispatch
            echo "FAIL: action succeeded unexpectedly without head/base inputs"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
