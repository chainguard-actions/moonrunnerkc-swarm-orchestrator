name: Test swarm-verify refused when fetch fails for provided head/base
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get real HEAD and parent commits
        id: commits
        run: |
          HEAD=$(git rev-parse HEAD)
          # Use HEAD~1 as base if available, otherwise use HEAD itself
          BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "HEAD: $HEAD"
          echo "BASE: $BASE"

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Provide real commit SHAs; the fetch will fail because the sentinel repo is not real
          head: ${{ steps.commits.outputs.head }}
          base: ${{ steps.commits.outputs.base }}
          comment: "false"
          attest: "false"
          allow-self-hosted: "true"

      - name: Assert action refused or failed gracefully
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          HEAD_OUT: ${{ steps.action.outputs.head }}
          BASE_OUT: ${{ steps.action.outputs.base }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          echo "status: $STATUS"
          echo "head: $HEAD_OUT"
          echo "base: $BASE_OUT"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (sentinel repo not fetchable)"
          elif [ "$OUTCOME" = "success" ]; then
            # If it somehow succeeded, result must be a valid terminal state
            case "$RESULT" in
              refused|incomplete|not-verified|verified|regression-only)
                echo "PASS: action completed with result=$RESULT"
                ;;
              *)
                echo "FAIL: unexpected result '$RESULT'"
                exit 1
                ;;
            esac
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
