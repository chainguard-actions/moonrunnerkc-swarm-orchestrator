name: Test refused when fetch fails (sentinel repo)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-build the action to warm npm cache
        run: |
          cd "$GITHUB_WORKSPACE"
          node --version
          npm ci --ignore-scripts
          npm run build:verify

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Provide syntactically valid head/base SHAs; the fetch will fail because
          # the sentinel GITHUB_REPOSITORY does not exist on GitHub.
          head: "0000000000000000000000000000000000000001"
          base: "0000000000000000000000000000000000000002"
          isolation: host
          attest: "false"
          comment: "false"
          allow-self-hosted: "true"

      - name: Assert action refused gracefully on fetch failure
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result:  $RESULT"
          echo "status:  $STATUS"
          # The action should have failed (exit 4 = refused/incomplete)
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (exit 4 for refused), got outcome=$OUTCOME"
            exit 1
          fi
          # When fetch fails, result should be 'refused'
          if [ "$RESULT" != "refused" ]; then
            echo "FAIL: expected result='refused', got '$RESULT'"
            exit 1
          fi
          echo "PASS: action refused as expected with result=$RESULT"
