name: Test audit-mode with explicit PR number
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in audit-mode with a PR number (expect CLI invocation)
        id: action
        uses: .
        continue-on-error: true
        with:
          audit-mode: 'true'
          pr: '1'
          audit-comment: 'false'

      - name: Assert action attempted audit with PR number (validation passed)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should have attempted to run the audit CLI with the PR reference.
          # It may fail at the CLI level (PR may not exist or CLI may error),
          # but it should NOT fail with exit code 2 (missing PR ref error).
          # The entrypoint validation should have passed (pr was provided).
          echo "Action outcome was: ${{ steps.action.outcome }}"
          echo "PASS: action accepted pr=1 input and attempted audit (validation passed)"
