name: Test docker isolation mode (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get HEAD and parent commit SHAs
        id: commits
        run: |
          HEAD=$(git rev-parse HEAD)
          BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          workspace: ${{ github.workspace }}
          head: ${{ steps.commits.outputs.head }}
          base: ${{ steps.commits.outputs.base }}
          # Use docker isolation (the default) — tests the docker path
          isolation: docker
          image: node:24-bookworm
          comment: "false"
          attest: "false"
          allow-self-hosted: "true"

      - name: Assert action ran with docker isolation
        env:
          RESULT: ${{ steps.action.outputs.result }}
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          echo "status: $STATUS"
          # The action should run and produce some verdict.
          # Docker-in-Docker may or may not be available under act, so we accept
          # any outcome as long as the action ran (not a build/setup failure).
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with docker isolation (outcome=$OUTCOME, result='$RESULT')"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
