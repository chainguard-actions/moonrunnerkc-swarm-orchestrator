name: Test host isolation with a head that breaks the tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare a fixture repository whose head breaks the test
        id: prep
        run: |
          set -e
          REPO="$RUNNER_TEMP/verify-repo-fail"
          rm -rf "$REPO"
          mkdir -p "$REPO"
          cd "$REPO"
          git init -q -b main .
          git config user.email "test@example.com"
          git config user.name "Test User"
          cat > package.json <<'EOF'
          {"name":"fixture","version":"1.0.0","private":true,"scripts":{"test":"node test.js"}}
          EOF
          cat > package-lock.json <<'EOF'
          {"name":"fixture","version":"1.0.0","lockfileVersion":3,"requires":true,"packages":{"":{"name":"fixture","version":"1.0.0"}}}
          EOF
          echo 'module.exports = (a, b) => a + b;' > lib.js
          cat > test.js <<'EOF'
          const assert = require('assert');
          const add = require('./lib.js');
          assert.strictEqual(add(1, 2), 3);
          console.log('ok');
          EOF
          git add -A
          git commit -q -m base
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo 'module.exports = (a, b) => a - b;' > lib.js
          git commit -q -am "broken head"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "dir=$REPO" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          isolation: host
          workspace: ${{ steps.prep.outputs.dir }}
          head: ${{ steps.prep.outputs.head }}
          base: ${{ steps.prep.outputs.base }}
          comment: "false"
          attest: "false"
          allow-self-hosted: "true"
      - name: Assert the broken head is not verified
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STATUS: ${{ steps.action.outputs.status }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome=$OUTCOME status=$STATUS result=$RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail for a broken head"
            exit 1
          fi
          if [ "$RESULT" = "verified" ] || [ "$STATUS" = "0" ]; then
            echo "FAIL: broken head reported as verified"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            case "$RESULT" in not-verified|incomplete|refused|head-changed) ;; *) echo "FAIL: bad result '$RESULT'"; exit 1 ;; esac
          fi
          echo "PASS"
