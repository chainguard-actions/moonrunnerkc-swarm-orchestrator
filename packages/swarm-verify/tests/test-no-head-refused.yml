name: Test refusal without pull request or head input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          isolation: host
          comment: "false"
          attest: "false"
          allow-self-hosted: "true"
      - name: Assert the action does not report verified
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STATUS: ${{ steps.action.outputs.status }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome=$OUTCOME status=$STATUS result=$RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no pull request and no head are given"
            exit 1
          fi
          if [ "$RESULT" = "verified" ] || [ "$STATUS" = "0" ]; then
            echo "FAIL: reported verified without a subject"
            exit 1
          fi
          echo "PASS"
