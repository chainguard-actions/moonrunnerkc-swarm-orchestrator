name: Test invalid base ref fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Prepare
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.swarm/verify"
      - id: action
        uses: .
        continue-on-error: true
        with:
          base: refs/heads/this-branch-does-not-exist-xyz
      - name: Assert action failed on unresolvable base
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a nonexistent base ref, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action rejected the nonexistent base"
